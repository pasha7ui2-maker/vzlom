name: Build CyberLab Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "cyber_scanner_gui.py"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build standalone EXE
        run: pyinstaller --onefile --windowed --name CyberLab cyber_scanner_gui.py
      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberLab-Windows
          path: dist/CyberLab.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish EXE to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="v2.0.${RUN_NUMBER}"
          gh release create "${TAG}" dist/CyberLab.exe \
            --title "CyberLab ${TAG}" \
            --notes "CyberLab Windows desktop toolkit: offline URL heuristics, local password checks, SHA-256 file integrity, and limited authorized network diagnostics. Use network checks only on systems you own or are authorized to test."
